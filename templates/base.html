<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}垃圾分类{% endblock %}</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.06);
            --green: #4ade80;
            --green-cyan: #22d3ee;
            --text: rgba(255, 255, 255, 0.9);
            --text-secondary: rgba(255, 255, 255, 0.5);
            --text-muted: rgba(255, 255, 255, 0.3);
            --danger: #f87171;
            --radius: 16px;
            --radius-sm: 10px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text);
            background: linear-gradient(135deg, #0a1628 0%, #0f1f0f 50%, #0a1628 100%);
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 60px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .navbar .brand {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--green), var(--green-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .navbar .nav-links .user-name {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .navbar .nav-links a,
        .navbar .nav-links button {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 7px 16px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .navbar .nav-links a:hover,
        .navbar .nav-links button:hover {
            background: var(--glass-hover);
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .main {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 24px 64px;
        }

        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 44px;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            color: #0a1628;
        }
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(74, 222, 128, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-ghost {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
        }
        .btn-ghost:hover {
            background: var(--glass-hover);
            color: var(--text);
        }

        .upload-zone {
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: var(--radius);
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-zone:hover, .upload-zone.drag-over {
            border-color: var(--green);
            background: rgba(74, 222, 128, 0.04);
        }
        .upload-zone .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }
        .upload-zone .text {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .upload-zone .hint {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 6px;
        }
        .upload-zone input[type="file"] { display: none; }

        .result-section {
            margin-top: 24px;
        }
        .result-main {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px;
            background: rgba(74, 222, 128, 0.06);
            border: 1px solid rgba(74, 222, 128, 0.15);
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
        }
        .result-main .label-name {
            font-size: 22px;
            font-weight: 700;
        }
        .result-main .category-tag {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(74, 222, 128, 0.15);
            color: var(--green);
        }
        .result-main .confidence {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--green), var(--green-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .top3-list { list-style: none; }
        .top3-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--glass-border);
            font-size: 13px;
        }
        .top3-list li:last-child { border-bottom: none; }
        .top3-list .rank { width: 24px; color: var(--text-muted); }
        .top3-list .bar-wrap {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            overflow: hidden;
        }
        .top3-list .bar-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--green), var(--green-cyan));
            transition: width 0.5s ease;
        }
        .top3-list .pct {
            width: 48px;
            text-align: right;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .suggestion {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            background: rgba(74, 222, 128, 0.08);
            border-left: 3px solid var(--green);
            font-size: 14px;
            color: var(--text-secondary);
        }

        .frames-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
            margin-top: 16px;
        }
        .frame-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 16px;
            text-align: center;
        }
        .frame-card .frame-num {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .frame-card .frame-label {
            font-weight: 600;
            font-size: 14px;
        }
        .frame-card .frame-cat {
            font-size: 11px;
            color: var(--green);
            margin-top: 2px;
        }
        .frame-card .frame-conf {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .camera-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }
        @media (max-width: 768px) {
            .camera-layout { grid-template-columns: 1fr; }
            .frames-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
        .camera-view {
            width: 100%;
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            background: #000;
        }
        .result-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px;
        }
        .history-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }
        .history-list li {
            padding: 10px 0;
            border-bottom: 1px solid var(--glass-border);
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-list li:last-child { border-bottom: none; }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }
        .select-custom {
            height: 44px;
            padding: 0 14px;
            border-radius: var(--radius-sm);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }
        .select-custom:focus {
            border-color: var(--green);
        }
        .select-custom option {
            background: #1a2a1a;
            color: var(--text);
        }

        .entry-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        @media (max-width: 640px) {
            .entry-cards { grid-template-columns: 1fr; }
        }
        .entry-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 32px 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .entry-card:hover {
            background: var(--glass-hover);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .entry-card .entry-icon { font-size: 36px; margin-bottom: 12px; }
        .entry-card .entry-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .entry-card .entry-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        .record-list { list-style: none; }
        .record-list li {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--glass-border);
            font-size: 14px;
        }
        .record-list li:last-child { border-bottom: none; }
        .record-list .rec-time {
            font-size: 12px;
            color: var(--text-muted);
            min-width: 100px;
        }
        .record-list .rec-cat {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(74, 222, 128, 0.1);
            color: var(--green);
            margin-left: auto;
        }

        .hidden { display: none !important; }

        .preview-img {
            max-width: 100%;
            max-height: 300px;
            border-radius: var(--radius-sm);
            margin: 16px auto;
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }
        .toast.error { background: rgba(248, 113, 113, 0.2); border: 1px solid var(--danger); color: var(--danger); }
        .toast.success { background: rgba(74, 222, 128, 0.15); border: 1px solid var(--green); color: var(--green); }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar">
        <a href="{% url 'accounts:home' %}" style="text-decoration:none;"><span class="brand">垃圾分类助手</span></a>
        <div class="nav-links">
            <span class="user-name">{{ user.username }}</span>
            <a href="{% url 'accounts:home' %}">首页</a>
            <form method="post" action="{% url 'accounts:logout' %}" style="display:inline">
                {% csrf_token %}
                <button type="submit">退出</button>
            </form>
        </div>
    </nav>
    {% endif %}

    <div class="main">
        {% block content %}{% endblock %}
    </div>

    <script>
        async function apiPost(url, body) {
    const resp = await fetch(url, {
        method: 'POST',
        headers: {'X-CSRFToken': getCSRF()},
        body: body instanceof FormData ? body : JSON.stringify(body),
    });
    return resp.json();
}

        function getCSRF() {
            const m = document.cookie.match(/csrftoken=([^;]+)/);
            return m ? m[1] : '';
        }
        function showToast(msg, type) {
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
